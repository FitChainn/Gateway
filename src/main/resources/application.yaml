server:
  port: 8091

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: cliente-service
          uri: ${CLIENTE_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/v1/clientes/**
        - id: cliente-docs
          uri: ${CLIENTE_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/clientes/v3/api-docs
          filters:
            - RewritePath=/clientes/v3/api-docs, /v3/api-docs

        - id: entrenador-service
          uri: ${ENTRENADOR_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/v1/entrenadores/**
        - id: entrenador-docs
          uri: ${ENTRENADOR_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/entrenador/v3/api-docs
          filters:
            - RewritePath=/entrenador/v3/api-docs, /v3/api-docs

        - id: equipo-service
          uri: ${EQUIPO_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/v1/equipos/**
        - id: equipo-docs
          uri: ${EQUIPO_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/equipo/v3/api-docs
          filters:
            - RewritePath=/equipo/v3/api-docs, /v3/api-docs

        - id: establecimiento-service
          uri: ${ESTABLECIMIENTO_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/v1/establecimientos/**
        - id: establecimiento-docs
          uri: ${ESTABLECIMIENTO_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/establecimiento/v3/api-docs
          filters:
            - RewritePath=/establecimiento/v3/api-docs, /v3/api-docs

        - id: asistencia-service
          uri: ${ASISTENCIA_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/v1/asistencias/**
        - id: asistencia-docs
          uri: ${ASISTENCIA_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/asistencia/v3/api-docs
          filters:
            - RewritePath=/asistencia/v3/api-docs, /v3/api-docs

        - id: horario-service
          uri: ${HORARIO_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/v1/horarios/**
        - id: horario-docs
          uri: ${HORARIO_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/horario/v3/api-docs
          filters:
            - RewritePath=/horario/v3/api-docs, /v3/api-docs

        - id: reserva-service
          uri: ${RESERVA_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/v1/reservas/**
        - id: reserva-docs
          uri: ${RESERVA_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/reserva/v3/api-docs
          filters:
            - RewritePath=/reserva/v3/api-docs, /v3/api-docs

        - id: membresia-service
          uri: ${MEMBRESIA_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/v1/membresias/**
        - id: membresia-docs
          uri: ${MEMBRESIA_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/membresia/v3/api-docs
          filters:
            - RewritePath=/membresia/v3/api-docs, /v3/api-docs

        - id: pago-service
          uri: ${PAGO_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/v1/pagos/**
        - id: pago-docs
          uri: ${PAGO_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/pago/v3/api-docs
          filters:
            - RewritePath=/pago/v3/api-docs, /v3/api-docs

        - id: notificacion-service
          uri: ${NOTIFICACION_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/v1/notificaciones/**
        - id: notificacion-docs
          uri: ${NOTIFICACION_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/notificacion/v3/api-docs
          filters:
            - RewritePath=/notificacion/v3/api-docs, /v3/api-docs

        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8092}
          predicates:
            - Path=/v1/auth/**
        - id: auth-docs
          uri: ${AUTH_SERVICE_URL:http://localhost:8092}
          predicates:
            - Path=/auth/v3/api-docs
          filters:
            - RewritePath=/auth/v3/api-docs, /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      enabled: true

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8092}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Clientes
        url: /clientes/v3/api-docs
      - name: Entrenador
        url: /entrenador/v3/api-docs
      - name: Equipo
        url: /equipo/v3/api-docs
      - name: Establecimiento
        url: /establecimiento/v3/api-docs
      - name: Asistencia
        url: /asistencia/v3/api-docs
      - name: Horario
        url: /horario/v3/api-docs
      - name: Reserva
        url: /reserva/v3/api-docs
      - name: Membresia
        url: /membresia/v3/api-docs
      - name: Pago
        url: /pago/v3/api-docs
      - name: Notificacion
        url: /notificacion/v3/api-docs
      - name: Auth
        url: /auth/v3/api-docs