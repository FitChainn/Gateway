server:
  port: 8091

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: cliente-service
          uri: http://localhost:8081
          predicates:
            - Path=/v1/clientes/**

        - id: entrenador-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/entrenadores/**

        - id: equipo-service
          uri: http://localhost:8083
          predicates:
            - Path=/v1/equipos/**

        - id: establecimiento-service
          uri: http://localhost:8084
          predicates:
            - Path=/v1/establecimientos/**

        - id: asistencia-service
          uri: http://localhost:8085
          predicates:
            - Path=/v1/asistencias/**

        - id: horario-service
          uri: http://localhost:8086
          predicates:
            - Path=/v1/horarios/**

        - id: reserva-service
          uri: http://localhost:8087
          predicates:
            - Path=/v1/reservas/**

        - id: membresia-service
          uri: http://localhost:8088
          predicates:
            - Path=/v1/membresias/**

        - id: pago-service
          uri: http://localhost:8089
          predicates:
            - Path=/v1/pagos/**

        - id: notificacion-service
          uri: http://localhost:8090
          predicates:
            - Path=/v1/notificaciones/**

        - id: auth-service
          uri: http://localhost:8092
          predicates:
            - Path=/v1/auth/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      enabled: true

auth:
  service:
    url: http://localhost:8092